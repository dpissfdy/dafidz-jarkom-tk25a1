<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickjacking Vulnerability Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            width: 80%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
        }

        .hasil {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Clickjacking Vulnerability Checker</h1>

    <form method="POST">
        <input
            type="text"
            name="url"
            placeholder="https://example.com"
            required
        >

        <button type="submit">
            Periksa
        </button>
    </form>

    <div class="hasil">
        {{ result }}
    </div>

</body>
</html>
